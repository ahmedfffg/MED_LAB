<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>اتصل بنا - معمل ميدلاب</title>

    <link rel="stylesheet" href="css/style.css">
    <link href="images/logo.png" type="image/x-icon" rel="icon">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        .contact {
            padding: 140px 0 50px;
            background: #0a4179;
            color: white;
            min-height: calc(100vh - 60px);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .section-titles {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 30px;
            color: white;
        }

        .ai-assistant-card {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            margin: 40px auto;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            border: none;
            transition: transform 0.4s, box-shadow 0.4s;
        }

        .ai-assistant-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .ai-icon {
            font-size: 3rem;
            color: #8ac4ff;
            margin-bottom: 15px;
            transition: transform 0.3s;
        }

        .ai-assistant-card:hover .ai-icon {
            transform: rotate(15deg) scale(1.2);
        }

        .ai-title {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }

        .ai-description {
            color: #fff;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .contact-form {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            max-width: 600px;
            margin: 0 auto;
            color: #1a2a3a;
        }

        .form-title {
            text-align: center;
            color: #0a4179;
            margin-bottom: 30px;
            font-size: 1.3rem;
            position: relative;
            padding-bottom: 15px;
        }

        .form-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 50%;
            transform: translateX(50%);
            width: 80px;
            height: 4px;
            background: #499bda;
            border-radius: 3px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #1a2a3a;
        }

        .form-group label i {
            color: #2a6a9a;
            margin-left: 6px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e8ecf0;
            border-radius: 10px;
            font-family: 'Tajawal', sans-serif;
            font-size: 0.95rem;
            transition: border 0.3s, box-shadow 0.3s;
            background: #fafbfc;
            color: #1a2a3a;
            box-sizing: border-box;
        }

        .form-control:focus {
            border-color: #2a6a9a;
            box-shadow: 0 0 0 4px rgba(42, 106, 154, 0.08);
            outline: none;
            background: white;
        }

        .form-control::placeholder {
            color: #a0aab5;
        }

        textarea.form-control {
            min-height: 150px;
            resize: vertical;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 12px 30px;
            background: linear-gradient(135deg, #0a4179, #499bda);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Tajawal', sans-serif;
            width: 100%;
            justify-content: center;
            text-decoration: none;
            box-sizing: border-box;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(42, 106, 154, 0.35);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .notification {
            position: fixed;
            top: 80px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            z-index: 9999;
            animation: slideIn 0.5s ease;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            max-width: 400px;
        }

        .notification-success { background: #10b981; }
        .notification-error { background: #ef4444; }
        .notification-info { background: #3b82f6; }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        .floating-whatsapp {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: #25D366;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            z-index: 999;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .floating-whatsapp:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(37, 211, 102, 0.5);
            color: white;
        }

        @media (max-width: 768px) {
            .contact { padding: 120px 0 30px; }
            .ai-assistant-card, .contact-form { padding: 20px; margin: 20px auto; }
            .floating-whatsapp { width: 50px; height: 50px; font-size: 1.5rem; bottom: 20px; left: 20px; }
            .section-titles { font-size: 1.8rem; }
        }

        @media (max-width: 480px) {
            .contact-form { padding: 15px; }
        }
    </style>
</head>

<body>

<main class="contact">
    <div class="container">
        <h1 class="section-titles">اتصل بنا</h1>

        <div class="ai-assistant-card">
            <i class="fas fa-robot ai-icon"></i>
            <h3 class="ai-title">المساعد الطبي الذكي</h3>
            <p class="ai-description">
                مساعدنا الافتراضي متاح للإجابة على استفساراتك الطبية العامة وتقديم النصائح الأولية
            </p>
            <a href="ai-assistant.html" class="btn">
                ابدأ المحادثة الآن
                <i class="fas fa-arrow-left"></i>
            </a>
        </div>

        <div class="contact-form">
            <h3 class="form-title">أو أرسل لنا رسالة مباشرة</h3>

            <form id="contactForm" novalidate>
                <div class="form-group">
                    <label for="message-type"><i class="fas fa-tag"></i> نوع الرسالة</label>
                    <select id="message-type" class="form-control" required>
                        <option value="">اختر نوع الرسالة</option>
                        <option value="complaint">شكوى</option>
                        <option value="inquiry">استفسار</option>
                        <option value="suggestion">مقترح</option>
                        <option value="other">أخرى</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="name"><i class="fas fa-user"></i> الاسم الكامل</label>
                    <input type="text" id="name" class="form-control" placeholder="أدخل اسمك الكامل" autocomplete="name" maxlength="150" required>
                </div>

                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> البريد الإلكتروني</label>
                    <input type="email" id="email" class="form-control" placeholder="example@email.com" autocomplete="email" maxlength="200" required>
                </div>

                <div class="form-group">
                    <label for="phone"><i class="fas fa-phone"></i> رقم الجوال</label>
                    <input type="tel" id="phone" class="form-control" placeholder="مثال: 01012345678" autocomplete="tel" maxlength="20" inputmode="numeric" required>
                </div>

                <div class="form-group">
                    <label for="message"><i class="fas fa-comment"></i> نص الرسالة</label>
                    <textarea id="message" rows="5" class="form-control" placeholder="اكتب رسالتك هنا..." maxlength="3000" required></textarea>
                </div>

                <button type="submit" class="btn" id="submitBtn">
                    <i class="fas fa-paper-plane"></i>
                    إرسال الرسالة
                </button>
            </form>
        </div>
    </div>
</main>

<a href="#" id="whatsappBtn" class="floating-whatsapp" target="_blank" rel="noopener noreferrer" aria-label="التواصل عبر واتساب">
    <i class="fab fa-whatsapp"></i>
</a>

<script>
const SUPABASE_URL = 'https://rlkqifdteyccagpdtdmu.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_XibO6Ri8DLKHG-rUEp4Bnw_bDzm67Xf';

async function sendToSupabase(data) {
    const url = `${SUPABASE_URL}/rest/v1/contact_messages`;
    const response = await fetch(url, {
        method: 'POST',
        headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
        },
        body: JSON.stringify(data)
    });
    if (!response.ok) {
        const errorText = await response.text();
        throw new Error(`HTTP ${response.status}: ${errorText}`);
    }
    return true;
}

document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async function (e) {
        e.preventDefault();

        const messageType = document.getElementById('message-type').value.trim();
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const messageText = document.getElementById('message').value.trim();

        if (!messageType || !name || !email || !phone || !messageText) {
            showNotification('الرجاء ملء جميع الحقول المطلوبة', 'error');
            return;
        }

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            showNotification('الرجاء إدخال بريد إلكتروني صحيح', 'error');
            return;
        }

        const cleanPhone = phone.replace(/\D/g, '');
        const phoneRegex = /^01[0-9]{9}$/;
        if (!phoneRegex.test(cleanPhone)) {
            showNotification('الرجاء إدخال رقم هاتف مصري صحيح (01xxxxxxxxx)', 'error');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإرسال...';

        try {
            await sendToSupabase({
                message_type: messageType,
                name: name,
                email: email,
                phone: cleanPhone,
                message: messageText,
                status: 'new'
            });

            showNotification('✅ تم إرسال رسالتك بنجاح! سيتم الرد عليك قريباً.', 'success');
            form.reset();
        } catch (error) {
            console.error('❌ خطأ أثناء إرسال الرسالة:', error);
            let errorMessage = 'حدث خطأ أثناء إرسال الرسالة. يرجى المحاولة مرة أخرى.';
            const errorText = String(error.message || '');
            if (errorText.includes('404')) {
                errorMessage = '⚠️ جدول contact_messages غير موجود في قاعدة البيانات.';
            } else if (errorText.includes('401') || errorText.includes('403')) {
                errorMessage = '⚠️ لا توجد صلاحية لإرسال الرسالة إلى قاعدة البيانات.';
            }
            showNotification(errorMessage, 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> إرسال الرسالة';
        }
    });

    function showNotification(message, type) {
        document.querySelectorAll('.notification').forEach(n => n.remove());
        const notification = document.createElement('div');
        notification.className = `notification notification-${type}`;
        notification.textContent = message;
        document.body.appendChild(notification);
        setTimeout(() => {
            notification.style.animation = 'slideOut 0.5s ease forwards';
            setTimeout(() => notification.remove(), 500);
        }, 5000);
    }

    document.querySelectorAll('a, button').forEach(function (element) {
        element.addEventListener('touchstart', function () { this.style.transform = 'scale(0.95)'; });
        element.addEventListener('touchend', function () { this.style.transform = ''; });
    });
});
</script>

<script>
(function () {
  'use strict';
  const WHATSAPP_PHONE = '+201061730854';
  const DEFAULT_MESSAGE = 'مرحباً ميدلاب، أريد الاستفسار عن ';

  function isMobileDevice() {
    return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  }

  function openWhatsApp() {
    const encodedMessage = encodeURIComponent(DEFAULT_MESSAGE);
    if (isMobileDevice()) {
      window.location.href = `https://wa.me/${WHATSAPP_PHONE}?text=${encodedMessage}`;
      return;
    }
    const desktopAppUrl = `whatsapp://send?phone=${WHATSAPP_PHONE}&text=${encodedMessage}`;
    const webUrl = `https://wa.me/${WHATSAPP_PHONE}?text=${encodedMessage}`;
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = desktopAppUrl;
    document.body.appendChild(iframe);
    setTimeout(function () {
      document.body.removeChild(iframe);
      window.open(webUrl, '_blank', 'noopener,noreferrer');
    }, 800);
  }

  document.addEventListener('DOMContentLoaded', function () {
    const btn = document.getElementById('whatsappBtn');
    if (!btn) return;
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      openWhatsApp();
    });
  });
})();
</script>
<script src="js/shared-header.js"></script>

<a href="index.html" class="floating-home" aria-label="الرجوع للصفحة الرئيسية" title="الرجوع للرئيسية">
  <i class="fas fa-home"></i>
</a>

</body>
</html>
