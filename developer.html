<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer - Ahmed Hussein | MedLab</title>
    <link href="../images/logo.png" type="image/x-icon" rel="icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;background:#071522}
body{min-height:100vh;padding:clamp(16px,4vw,42px);display:flex;align-items:center;justify-content:center;background:#071522;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 15%,rgba(56,145,220,.12),transparent 30%),radial-gradient(circle at 85% 85%,rgba(70,180,240,.08),transparent 32%)}
.container{width:100%;max-width:760px;position:relative;z-index:1}
.dev-card{position:relative;overflow:hidden;width:100%;padding:clamp(28px,5vw,52px);text-align:center;background:#0b2238;border:1px solid rgba(138,196,255,.18);border-radius:clamp(18px,3vw,28px);box-shadow:0 18px 45px rgba(0,0,0,.32);animation:pageIn .45s ease-out both}
.dev-card::after{content:"";position:absolute;top:0;left:12%;right:12%;height:2px;background:linear-gradient(90deg,transparent,#8ac4ff,transparent);opacity:.7}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.dev-icon{width:clamp(72px,12vw,96px);height:clamp(72px,12vw,96px);margin:0 auto 20px;display:grid;place-items:center;border-radius:24px;background:linear-gradient(135deg,#3f91d0,#78bdf0);font-size:clamp(28px,5vw,40px);box-shadow:0 10px 24px rgba(55,145,210,.25)}
.dev-title{color:#8ac4ff;font-size:.82rem;font-weight:700;letter-spacing:4px;margin-bottom:10px}
.signature-box{position:relative;max-width:520px;margin:0 auto 10px;padding:4px 12px 0}.signature-name{font-weight:400;line-height:1;white-space:nowrap;color:#fff;text-shadow:0 3px 14px rgba(92,174,235,.22)}.signature-en{font-family:"Brush Script MT","Segoe Script","URW Chancery L",cursive;font-size:clamp(2.9rem,8vw,5rem);font-style:italic;letter-spacing:-1px}.signature-swoosh{display:block;width:min(100%,420px);height:34px;margin:-2px auto 0;overflow:visible}.signature-swoosh path{fill:none;stroke:#8ac4ff;stroke-width:2;stroke-linecap:round;opacity:.75}
.dev-desc{max-width:560px;margin:0 auto 28px;color:#b9d2e7;font-size:clamp(.92rem,2.2vw,1.08rem);line-height:1.9}
.skills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:30px}
.skill-tag{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;color:#cfe5f7;background:#102d47;border:1px solid rgba(138,196,255,.16);border-radius:999px;font-size:.8rem;transition:transform .18s ease,border-color .18s ease}
.skill-tag i{color:#8ac4ff}.skill-tag:hover{transform:translateY(-2px);border-color:rgba(138,196,255,.5)}
.contact-title{color:#8ac4ff;font-size:.9rem;font-weight:700;letter-spacing:2px;margin-bottom:14px}
.social-links{display:flex;justify-content:center;gap:10px}
.social-btn{width:48px;height:48px;display:grid;place-items:center;color:#cfe5f7;background:#102d47;border:1px solid rgba(138,196,255,.18);border-radius:14px;text-decoration:none;font-size:18px;transition:transform .18s ease,background .18s ease}
.social-btn:hover{transform:translateY(-2px);background:#174365}
.dev-footer{margin-top:28px;padding-top:18px;border-top:1px solid rgba(138,196,255,.12);color:#7898b3;font-size:.78rem;line-height:1.8}.dev-footer strong{color:#8ac4ff!important}.heart{color:#ff6b8a;display:inline-block}
.top-controls{position:fixed;top:16px;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:0 16px;pointer-events:none;direction:ltr}.back-btn,.lang-btn{pointer-events:auto;display:inline-flex;align-items:center;gap:7px;padding:9px 13px;color:#fff;background:#0b2238;border:1px solid rgba(138,196,255,.18);border-radius:11px;text-decoration:none;font-weight:700;font-size:13px}.back-btn{order:2}.lang-btn{order:1;font-family:inherit;cursor:pointer}.lang-btn:hover,.back-btn:hover{background:#123653}
.fade-in{animation:fadeIn .35s ease-out both}.delay-3{animation-delay:.08s}.delay-4{animation-delay:.14s}.delay-5{animation-delay:.2s}.delay-6{animation-delay:.26s}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(max-width:520px){body{padding:58px 10px 14px;align-items:flex-start}.top-controls{top:10px;left:0;right:0;padding:0 10px}.back-btn,.lang-btn{padding:8px 10px;font-size:12px}.dev-card{padding:27px 14px}.dev-icon{border-radius:20px;margin-bottom:17px}.dev-title{letter-spacing:3px;font-size:.76rem}.signature-en{font-size:clamp(2.5rem,12vw,3.5rem)}.signature-box{padding-left:4px;padding-right:4px}.signature-swoosh{height:28px}.dev-desc{font-size:.9rem;line-height:1.75;margin-bottom:22px}.skills{gap:6px;margin-bottom:24px}.skill-tag{padding:7px 9px;font-size:.7rem}.dev-footer{font-size:.7rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

    <div class="top-controls">
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-left"></i>
            <span data-en="Back" data-ar="رجوع">Back</span>
        </a>
        <button type="button" class="lang-btn" id="langToggle" aria-label="Switch language">
            <i class="fas fa-language"></i>

    <div class="container">

            <div class="signature-box">
                <div class="signature-name signature-en" data-en="Ahmed Hussein" data-ar="أحمد حسين">Ahmed Hussein</div>
                <svg class="signature-swoosh" viewBox="0 0 420 55" aria-hidden="true">
                    <path d="M10 30 C85 52 135 8 205 28 S330 46 410 13"/>
                </svg>
            </div>

            <p class="dev-desc fade-in delay-3" data-en="Web developer specialized in building medical laboratory management systems<br>and designing modern, fast user interfaces" data-ar="مطور ويب متخصص في بناء أنظمة إدارة المعامل الطبية<br>وتصميم واجهات مستخدم عصرية وسريعة">
                Web developer specialized in building medical laboratory management systems<br>and designing modern, fast user interfaces

                <span class="skill-tag"><i class="fas fa-server"></i> PostgreSQL</span>
                <span class="skill-tag" data-en="Responsive" data-ar="متجاوب"><i class="fas fa-mobile-alt"></i> Responsive</span>
            </div>

            <div class="fade-in delay-5">
                <div class="contact-title" data-en="Contact Me" data-ar="تواصل معي">Contact Me</div>
                <div class="social-links">
                    <a href="https://wa.me/201070293453" target="_blank" rel="noopener" class="social-btn" title="WhatsApp" aria-label="WhatsApp">
                        <i class="fab fa-whatsapp"></i>
                    </a>
                    <a href="tel:+201070293453" class="social-btn" title="Phone" aria-label="Phone">
                        <i class="fas fa-phone"></i>
                    </a>
                    <a href="mailto:ahmehussein8039@gmail.com" class="social-btn" title="Email" aria-label="Email">
                        <i class="fas fa-envelope"></i>
                    </a>
                </div>
            </div>

            <div class="dev-footer fade-in delay-6">
                <span data-en='Made with <span class="heart">❤</span> by <strong>Ahmed Hussein</strong><br>© 2026 MedLab Laboratory - All Rights Reserved' data-ar='صُنع بـ <span class="heart">❤</span> بواسطة <strong>أحمد حسين</strong><br>© 2026 معمل ميدلاب - جميع الحقوق محفوظة'>
                    Made with <span class="heart">❤</span> by <strong>Ahmed Hussein</strong><br>
                    © 2026 MedLab Laboratory - All Rights Reserved
                </span>
            </div>

            <script>
                (function () {
                    const root = document.documentElement;
                    const toggle = document.getElementById('langToggle');
                    const langText = document.getElementById('langText');
                    const translatable = document.querySelectorAll('[data-en][data-ar]');
                    let language = 'en';

                    function setLanguage(lang) {
                        language = lang;
                        root.lang = lang;
                        root.dir = lang === 'ar' ? 'rtl' : 'ltr';
                        translatable.forEach(function (el) {
                            el.innerHTML = el.getAttribute('data-' + lang);
                        });
                        langText.textContent = lang === 'en' ? 'العربية' : 'English';
                        toggle.setAttribute('aria-label', lang === 'en' ? 'Switch to Arabic' : 'Switch to English');
                        document.title = lang === 'en' ? 'Developer - Ahmed Hussein | MedLab' : 'المطور - أحمد حسين | معمل ميدلاب';
                    }

                    toggle.addEventListener('click', function () {
                        setLanguage(language === 'en' ? 'ar' : 'en');
                    });
                })();
            </script>

        </div>
    </div>
</body>
</html>
