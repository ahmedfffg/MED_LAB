          <li><a href="index.html#services"><i class="fas fa-flask"></i> خدماتنا</a></li>

  <section class="ai-assistant section-padding">
    <div class="container">
      <div class="ai-container">
        <div class="ai-header">
          <div class="ai-avatar">
            <i class="fas fa-robot"></i>
          </div>
          <div class="ai-info">
            <h3>مساعد المعمل الذكي</h3>
            <p>كيف يمكنني مساعدتك اليوم؟</p>
          </div>
        </div>
        
        <div class="ai-chat-container">
          <div class="ai-message ai-response">
            <div class="message-content">
              <p>مرحبًا! أنا مساعد المعمل الذكي. كيف يمكنني مساعدتك اليوم؟</p>
            </div>
          </div>
          
          <div class="quick-questions">
            <h4>أسئلة سريعة:</h4>
            <div class="questions-grid">
              <button class="question-btn" data-question="دليل استخدام الموقع">
                <i class="fas fa-book-open"></i> دليل استخدام الموقع
              </button>
              <button class="question-btn" data-question="كيف يمكنني حجز موعد؟">
                كيف يمكنني حجز موعد؟
              </button>
              <button class="question-btn" data-question="ما هي ساعات العمل؟">
                ما هي ساعات العمل؟
              </button>
              <button class="question-btn" data-question="أين يقع المعمل؟">
                أين يقع المعمل؟
              </button>
              <button class="question-btn" data-question="تفاصيل عن الاسعار؟">
                تفاصيل عن الاسعار؟
              </button>  
              <button class="question-btn" data-question="ما هي طرق الدفع المتاحة؟">
                ما هي طرق الدفع المتاحة؟
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer"></footer>

  <script src="js/ai.js"></script>

  <a href="index.html" class="floating-home" aria-label="الرجوع للصفحة الرئيسية" title="الرجوع للرئيسية">
